name: Image

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Check source syntax
        run: |
          node --check server.js
          bash -n entrypoint.sh
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/guionai/browser
          tags: |
            type=raw,value=pr,enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test browser connection
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm -d --name browser-smoke ghcr.io/guionai/browser:pr
          trap 'docker logs browser-smoke; docker stop browser-smoke' EXIT
          for attempt in $(seq 1 30); do
            if docker exec browser-smoke node --input-type=module -e "
              import { chromium } from 'rebrowser-playwright';
              const browser = await chromium.connect('ws://127.0.0.1:3000/');
              const page = await browser.newPage();
              await page.goto('data:text/html,<title>ready</title>');
              if (await page.title() !== 'ready') process.exit(1);
              await browser.close();
            "; then
              exit 0
            fi
            sleep 1
          done
          exit 1
